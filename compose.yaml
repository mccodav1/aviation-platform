name: aviation-platform

# Keep container logs from filling a small instance's disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # Minor updates (17.x) arrive on rebuild and are safe. Changing the
    # MAJOR version (17 -> 18) is not a one-line change: Postgres can't read
    # an older major version's data files - see "Upgrading Postgres" in
    # docs/DEPLOY.md before touching this tag.
    image: postgres:17-alpine
    restart: unless-stopped
    # Docker's default 10s before force-killing a stopping container can
    # cut off a clean Postgres shutdown; give it a minute.
    stop_grace_period: 1m
    # Docker's default 64MB /dev/shm is too small for some Postgres
    # operations (parallel queries, large sorts) - the usual recommendation.
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aviation}
      POSTGRES_USER: ${POSTGRES_USER:-aviation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed by this compose setup rather than by .env, so the same .env
      # still runs plain `make runserver` against SQLite outside compose.
      POSTGRES_HOST: db
      DATA_DIR: /data
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env (see .env.example)}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env (see .env.example)}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:?Set DJANGO_SUPERUSER_EMAIL in .env (see .env.example)}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?Set DJANGO_SUPERUSER_PASSWORD in .env (see .env.example)}
    volumes:
      - media:/data/media
      - private_media:/data/private_media
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # http.conf until the site has a certificate, then https.conf - see
      # "Enabling HTTPS" in docs/DEPLOY.md. Only those two values work.
      - ./docker/nginx/${NGINX_SITE:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/00-rate-limits.conf:/etc/nginx/conf.d/00-rate-limits.conf:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
      - media:/srv/media:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Reloads every 6 hours so a certificate the certbot service renewed
    # gets picked up; a reload doesn't drop connections.
    command: ["/bin/sh", "-c", "while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      - web
    logging: *logging

  # Renews the Let's Encrypt certificate (see `make cert`) when it's
  # within 30 days of expiring - a no-op until one exists.
  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    environment:
      CERT_DOMAINS: ${CERT_DOMAINS:-}
      CERT_EMAIL: ${CERT_EMAIL:-}
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]
    logging: *logging

volumes:
  pgdata:
  media:
  private_media:
  # The Let's Encrypt account and certificate, and the folder its
  # domain checks are answered from.
  letsencrypt:
  certbot_www:
