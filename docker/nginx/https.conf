# HTTPS (NGINX_SITE=https). Needs the certificate from `make cert` to
# exist first - nginx won't start without it. See "Enabling HTTPS" in
# docs/DEPLOY.md.

# Port 80 only answers Let's Encrypt's renewal checks and sends
# everything else to HTTPS.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Catch-all: adding a domain needs it in DJANGO_ALLOWED_HOSTS and on
    # the certificate (CERT_DOMAINS, then `make cert` again).
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    # `make cert` always names the certificate "site", whatever domains
    # it covers, so this path never changes.
    ssl_certificate /etc/letsencrypt/live/site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/app.conf;
}
