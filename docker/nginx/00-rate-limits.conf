# Per-IP rate limits for the forms bots go after: logging in (password
# guessing) and the public Join/Contact forms (spam). Only POSTs count -
# loading a page is never limited. Applied in snippets/app.conf.
#
# Lives in conf.d (http context), named to sort before default.conf.
# Django's own login lockout (core/throttle.py) still applies on top of
# this - it's per IP + email, so on its own it doesn't stop one address
# trying a password against many accounts.

map $request_method $post_client_ip {
    POST    $binary_remote_addr;
    default "";  # an empty key isn't limited
}

# Generous enough for a meeting full of members logging in at once from
# the same Wi-Fi (one public IP): a burst of 10, then one every 6s.
limit_req_zone $post_client_ip zone=login:10m rate=10r/m;

# A real person submits these once, maybe again after a typo: a burst of
# 5, then one every 20s.
limit_req_zone $post_client_ip zone=public_forms:10m rate=3r/m;

limit_req_status 429;
