# Plain HTTP - the default (NGINX_SITE=http), used until the site has a
# certificate. See "Enabling HTTPS" in docs/DEPLOY.md for switching to
# https.conf.
server {
    # Catch-all: adding a domain only needs it in DJANGO_ALLOWED_HOSTS.
    listen 80 default_server;
    server_name _;

    # Let's Encrypt's check that we control the domain (`make cert`).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/app.conf;
}
