# The site itself - included by the server block that serves it, in
# http.conf (plain HTTP) or https.conf (the 443 block).

server_tokens off;

# Resource/agenda uploads go through Django; keep this above the
# largest file officers are expected to upload.
client_max_body_size 25m;

# Look `web` up through Docker's DNS as requests come in, rather than
# once at startup (which an `upstream` block does). Rebuilding web
# (`make up`) recreates its container, possibly at a new IP, while
# nginx keeps running - with a startup-time lookup nginx kept the
# old IP and every request 502'd until nginx was restarted.
# proxy_pass only re-resolves when given a variable.
resolver 127.0.0.11 valid=10s ipv6=off;
set $django_upstream http://web:8000;

# Inherited by every proxy_pass location below (none sets its own).
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;

# Public uploads (logo, hero/card photos), served straight off the
# media volume, mounted read-only. private_media is deliberately never
# mounted into this container, so nginx can't serve it even by mistake -
# those files are only reachable through Django's gated views.
location /media/ {
    alias /srv/media/;
    expires 7d;
}

# Rate-limited forms (zones in 00-rate-limits.conf).
location = /login/ {
    limit_req zone=login burst=10 nodelay;
    proxy_pass $django_upstream;
}

location = /admin/login/ {
    limit_req zone=login burst=10 nodelay;
    proxy_pass $django_upstream;
}

location = /join {
    limit_req zone=public_forms burst=5 nodelay;
    proxy_pass $django_upstream;
}

location = /contact {
    limit_req zone=public_forms burst=5 nodelay;
    proxy_pass $django_upstream;
}

location / {
    proxy_pass $django_upstream;
}

# What a rate-limited person sees, instead of nginx's bare error page.
error_page 429 @too_many_requests;
location @too_many_requests {
    default_type text/html;
    return 429 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Too many tries</title></head><body style="font-family: sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #113456;"><h1>Too many tries</h1><p>That form has been submitted a lot from your connection in the last minute. Wait a minute, then go back and try again.</p></body></html>';
}
