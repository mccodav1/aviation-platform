<div class="info-panel">

    {% if panel.icon %}
        <i class="bi bi-{{ panel.icon }} info-panel-icon"></i>
    {% endif %}

    <h3>{{ panel.title }}</h3>

    {% if panel.body %}
        <p>{{ panel.body|linebreaksbr }}</p>
    {% endif %}

    {% if panel.link and panel.link_text %}
        <a href="{{ panel.link }}" class="info-panel-link">
            {{ panel.link_text }} →
        </a>
    {% endif %}

</div>
